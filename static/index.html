<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#f4eee3" />
  <title data-i18n="app.title">&nbsp;</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <!-- Before the stylesheets on purpose: applies a saved dark choice before
       first paint, so the page never flashes the wrong theme. -->
  <script src="/js/theme.js"></script>
  <script src="/js/zoom.js"></script>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/cards.css" />
  <link rel="stylesheet" href="/css/lobby.css" />
  <link rel="stylesheet" href="/css/table.css" />
</head>
<body>
  <!--
    No text is hardcoded here. Every visible string carries a data-i18n key
    that server/language resolves from language.yaml at runtime. All artwork
    (cards, the bird, the wordmark) is drawn as SVG by js/art.js and
    js/cards.js -- there are no image files.

    Four screens, one visible at a time, switched by the hash router in
    js/app.js: signed-out, lobby (#/), a table (#/t/<id>), settings
    (#/settings).
  -->

  <!-- ===================================================== signed out -->
  <section id="screen-signed-out" class="screen screen-splash" hidden>
    <div class="splash">
      <div class="splash-art" data-art="splash"></div>
      <p class="splash-tagline" data-i18n="app.tagline"></p>
      <div class="card splash-card">
        <h2 data-i18n="signed_out.heading"></h2>
        <p data-i18n="signed_out.body"></p>
        <p id="invalid-link" class="notice notice-warn" data-i18n="signed_out.invalid_link" hidden></p>
      </div>
    </div>
  </section>

  <!-- ================================================ one-time login link -->
  <!-- What a login link opens. Nothing is redeemed until the button is
       pressed -- see App.showLoginConfirm in app.js. -->
  <section id="screen-login" class="screen screen-splash" hidden>
    <div class="splash">
      <div class="splash-art gate-wordmark" data-art="wordmark"></div>
      <div class="card gate-card">
        <h2 data-i18n="login_confirm.heading"></h2>
        <p id="login-body" data-i18n="login_confirm.body"></p>
        <p id="login-switch-warning" class="notice notice-warn" hidden></p>
        <p id="login-invalid" class="notice notice-warn" data-i18n="signed_out.invalid_link" hidden></p>
        <button id="login-confirm-button" type="button" data-i18n="login_confirm.button"></button>
      </div>
    </div>
  </section>

  <!-- ============================================== join a table link -->
  <section id="screen-join" class="screen screen-splash" hidden>
    <div class="splash">
      <div class="gate-bird" data-art="bird"></div>
      <div class="card gate-card">
        <p class="gate-kicker" data-i18n="join.kicker"></p>
        <h2 id="join-table-name"></h2>
        <p id="join-status" class="muted"></p>
        <form id="join-signup-form" autocomplete="off" hidden>
          <div class="field">
            <label for="join-name" data-i18n="join.name_label"></label>
            <input id="join-name" maxlength="80" required autocomplete="nickname"
                   data-i18n-attr="placeholder:join.name_placeholder" />
          </div>
          <button type="submit" data-i18n="join.submit"></button>
        </form>
        <p id="join-closed" class="notice notice-warn" data-i18n="join.closed" hidden></p>
        <p id="join-working" class="muted" data-i18n="join.working" hidden></p>
        <p id="join-error" class="notice notice-error" hidden></p>
      </div>
    </div>
  </section>

  <!-- ========================================= multi-use sign-up link -->
  <section id="screen-signup" class="screen screen-splash" hidden>
    <div class="splash">
      <div class="splash-art gate-wordmark" data-art="wordmark"></div>
      <div class="card gate-card">
        <p class="gate-kicker" data-i18n="signup.kicker"></p>
        <h2 id="signup-label"></h2>
        <p id="signup-signed-in" class="notice notice-warn" hidden></p>
        <form id="signup-name-form" autocomplete="off">
          <div class="field">
            <label for="signup-name" data-i18n="signup.name_label"></label>
            <input id="signup-name" maxlength="80" required autocomplete="nickname"
                   data-i18n-attr="placeholder:signup.name_placeholder" />
          </div>
          <button type="submit" data-i18n="signup.continue"></button>
        </form>
        <div id="signup-matches" hidden>
          <p id="signup-question" class="gate-question"></p>
          <div id="signup-match-list" class="match-list"></div>
          <button id="signup-new" type="button" class="secondary"></button>
          <button id="signup-back" type="button" class="ghost" data-i18n="signup.back"></button>
        </div>
        <form id="signup-pin-form" autocomplete="off" hidden>
          <p id="signup-pin-for"></p>
          <div class="field">
            <label for="signup-pin" data-i18n="signup.pin_label"></label>
            <input id="signup-pin" inputmode="numeric" pattern="[0-9]*" maxlength="8" required autocomplete="one-time-code" />
          </div>
          <button type="submit" data-i18n="signup.pin_submit"></button>
          <button id="signup-pin-back" type="button" class="ghost" data-i18n="signup.back"></button>
        </form>
        <p id="signup-error" class="notice notice-error" hidden></p>
      </div>
    </div>
  </section>

  <!-- ========================================================== lobby -->
  <section id="screen-lobby" class="screen screen-lobby" hidden>
    <header class="lobby-header">
      <div class="lobby-brand">
        <div class="lobby-bird" data-art="bird"></div>
        <div class="lobby-wordmark" data-art="wordmark"></div>
      </div>
      <div class="lobby-header-actions">
        <button id="lobby-fullscreen" type="button" class="icon-button bar-fullscreen" data-fullscreen data-i18n-attr="aria-label:table.fullscreen,title:table.fullscreen">
          <svg class="fs-enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <svg class="fs-exit" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="open-guide" type="button" class="icon-button" data-i18n-attr="aria-label:guide.button,title:guide.button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 11v6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="7.6" r="1.4" fill="currentColor"/></svg>
        </button>
        <button id="open-games" type="button" class="icon-button" data-i18n-attr="aria-label:games.heading,title:games.heading">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M3 4v4.5h4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="open-settings" type="button" class="avatar-button" data-i18n-attr="aria-label:nav.settings,title:nav.settings"></button>
      </div>
    </header>

    <div class="lobby-body">
    <main class="lobby-main">
      <section id="held-tables-section" class="lobby-section" hidden>
        <h2 data-i18n="lobby.held_tables"></h2>
        <div id="held-tables" class="table-list"></div>
      </section>

      <section id="my-tables-section" class="lobby-section" hidden>
        <h2 data-i18n="lobby.your_tables"></h2>
        <div id="my-tables" class="table-list"></div>
      </section>

      <section id="open-tables-section" class="lobby-section">
        <h2 data-i18n="lobby.open_tables"></h2>
        <div id="open-tables" class="table-list"></div>
        <div id="lobby-empty" class="empty-state" hidden>
          <div class="empty-art" data-art="bird"></div>
          <p data-i18n="lobby.empty"></p>
        </div>
      </section>
    </main>

    <!-- Who is online, and the chat everyone shares (global.js). Beside the
         tables on a wide screen, under them on a phone. -->
    <aside class="lobby-side">
      <section class="lobby-section lobby-online">
        <h2 id="online-heading"></h2>
        <ul id="online-list" class="online-list"></ul>
      </section>
      <section id="lobby-global" class="lobby-section lobby-global">
        <h2 data-i18n="global.heading"></h2>
        <div class="lobby-global-box">
          <ol id="lobby-global-list" class="chat-list" aria-live="polite"></ol>
          <p id="lobby-global-off" class="muted" data-i18n="global.off" hidden></p>
          <form id="lobby-global-form" class="chat-form" autocomplete="off">
            <input id="lobby-global-input" maxlength="280" data-i18n-attr="placeholder:global.placeholder,aria-label:global.placeholder" />
            <button type="submit" class="small" data-i18n="chat.send"></button>
          </form>
        </div>
      </section>
    </aside>
    </div>

    <div class="fab-bar">
      <button id="new-table-button" type="button" class="fab" data-i18n="lobby.new_table"></button>
    </div>
  </section>

  <!-- ============================================== rules & strategy -->
  <section id="screen-guide" class="screen screen-guide" hidden>
    <header class="page-header">
      <button id="guide-back" type="button" class="icon-button" data-i18n-attr="aria-label:nav.back,title:nav.back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1 class="visually-hidden" data-i18n="guide.heading"></h1>
      <!-- The tabs live in the sticky header so they stay in reach however
           far down the page you are. -->
      <div class="segmented guide-tabs" role="tablist" data-i18n-attr="aria-label:guide.tabs_label">
        <button type="button" role="tab" data-guide-tab="rules" data-i18n="guide.rules_tab"></button>
        <button type="button" role="tab" data-guide-tab="strategy" data-i18n="guide.strategy_tab"></button>
        <button type="button" role="tab" data-guide-tab="bots" data-i18n="guide.bots_tab"></button>
        <button type="button" role="tab" data-guide-tab="about" data-i18n="guide.about_tab"></button>
      </div>
      <span class="guide-header-spacer" aria-hidden="true"></span>
    </header>

    <main class="guide-main">
      <nav id="guide-contents" class="guide-contents" data-i18n-attr="aria-label:guide.contents">
        <span class="guide-contents-label" data-i18n="guide.contents"></span>
        <ul id="guide-jumps" class="chip-row"></ul>
      </nav>
      <div id="guide-body" class="guide-body"></div>
    </main>
  </section>

  <!-- ==================================================== game history -->
  <section id="screen-games" class="screen screen-games" hidden>
    <header class="page-header">
      <button id="games-back" type="button" class="icon-button" data-i18n-attr="aria-label:nav.back,title:nav.back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1 id="games-title" data-i18n="games.heading"></h1>
    </header>

    <main class="lobby-main">
      <div id="games-list-view">
        <p class="muted" data-i18n="games.description"></p>
        <div id="games-list" class="table-list"></div>
        <div id="games-empty" class="empty-state" hidden>
          <div class="empty-art" data-art="bird"></div>
          <p data-i18n="games.empty"></p>
        </div>
        <button id="games-more" type="button" class="secondary games-more" data-i18n="games.load_more" hidden></button>
      </div>
      <div id="games-detail-view" hidden>
        <div id="games-detail-head" class="game-detail-head"></div>
        <ol id="games-detail-record" class="chat-list log-list game-detail-record"></ol>
      </div>
    </main>
  </section>

  <!-- ========================================================== table -->
  <section id="screen-table" class="screen screen-table" hidden>
    <header class="table-bar">
      <button id="table-back" type="button" class="icon-button" data-i18n-attr="aria-label:nav.back,title:nav.back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <!-- One bar for everything above the table: where you are, what is
           happening, the score, and (for admins) stepping through moves. -->
      <div class="table-title">
        <div class="table-headline">
          <span id="table-name" class="table-name"></span>
          <span id="table-contract" class="table-contract"></span>
        </div>
        <div id="table-status" class="table-status"></div>
      </div>
      <div id="admin-controls" class="admin-controls" hidden>
        <span id="admin-position" class="admin-position"></span>
        <button id="admin-undo" type="button" class="icon-button bar-icon" data-i18n-attr="aria-label:admin_game.undo_label,title:admin_game.undo_label">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
        <button id="admin-redo" type="button" class="icon-button bar-icon" data-i18n-attr="aria-label:admin_game.redo_label,title:admin_game.redo_label">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14l5-5-5-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
        <button id="admin-resume" type="button" class="icon-button bar-icon bar-resume" data-i18n-attr="aria-label:admin_game.resume_label,title:admin_game.resume_label" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>
        </button>
      </div>
      <div id="table-scores" class="scoreboard"></div>
      <button id="table-fullscreen" type="button" class="icon-button bar-fullscreen" data-fullscreen data-i18n-attr="aria-label:table.fullscreen,title:table.fullscreen">
          <svg class="fs-enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <svg class="fs-exit" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="table-menu" type="button" class="icon-button" data-i18n-attr="aria-label:table.menu,title:table.menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2.2" fill="currentColor"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/><circle cx="19" cy="12" r="2.2" fill="currentColor"/></svg>
        <span id="chat-unread" class="badge-dot" hidden></span>
      </button>
      <!-- On a phone the hand's line (contract, trump, dealer) has no room
           beside the scores, so table.js copies it here: a row of its own
           under the bar. Only one of the two is ever displayed. -->
      <div id="table-contract-row" class="table-contract table-contract-row"></div>
    </header>

    <div id="felt" class="felt">
      <!-- Both float over the table rather than taking rows of their own, so
           showing them never changes the size of anything. -->
      <div id="connection-banner" class="connection-banner" hidden>
        <span data-i18n="table.reconnecting"></span>
      </div>
      <div id="all-hands" class="all-hands" hidden></div>
      <div id="trick" class="trick" aria-hidden="true"></div>
      <!-- The bids so far, while the hand is bid for (bidding.js). -->
      <div id="auction" class="auction" hidden></div>
      <div id="takeover-requests" class="takeover-requests" aria-live="polite" hidden></div>
      <div id="card-entry" class="card-entry" aria-live="polite" hidden></div>
      <div id="waiting-room" class="waiting-room" hidden>
        <h2 id="waiting-title" class="waiting-title"></h2>
        <ul id="waiting-rules" class="chip-row"></ul>
        <p id="waiting-status" class="waiting-status"></p>
        <!-- With every seat filled, the host names who deals first. -->
        <div id="dealer-pick" class="dealer-pick" hidden>
          <p class="dealer-pick-title" data-i18n="waiting.dealer_heading"></p>
          <div id="dealer-pick-options" class="dealer-pick-options" role="radiogroup" data-i18n-attr="aria-label:waiting.dealer_heading"></div>
        </div>
        <div class="waiting-actions">
          <button id="deal-button" type="button" data-i18n="waiting.deal" hidden></button>
          <button id="waiting-leave" type="button" class="secondary" data-i18n="table.leave"></button>
        </div>
      </div>
    </div>

    <div id="tray" class="tray"></div>
    <div id="hand" class="hand" role="group" data-i18n-attr="aria-label:hand.label"></div>
    <!-- Chat beside your cards, on wide screens, when chosen in Settings. -->
    <aside id="chat-dock" class="chat-dock" data-i18n-attr="aria-label:chat.tab_chat">
      <h3 class="chat-dock-title" data-i18n="chat.tab_chat"></h3>
      <ol id="chat-dock-list" class="chat-list chat-dock-list" aria-live="polite"></ol>
      <p class="guest-chat-as" data-guest-as hidden>
        <span data-guest-as-text></span>
        <button type="button" class="link-button" data-guest-change data-i18n="chat.change_name"></button>
      </p>
      <form id="chat-dock-form" class="chat-form chat-dock-form" autocomplete="off">
        <input data-guest-name class="guest-name" maxlength="24" hidden data-i18n-attr="placeholder:chat.guest_name_placeholder,aria-label:chat.guest_name_placeholder" />
        <input id="chat-dock-input" maxlength="280" data-i18n-attr="placeholder:chat.placeholder,aria-label:chat.placeholder" />
        <button type="submit" class="small" data-i18n="chat.send"></button>
      </form>
    </aside>
    <!-- The global chat's dock: the other side of your cards. -->
    <aside id="global-dock" class="chat-dock" data-i18n-attr="aria-label:global.heading">
      <h3 class="chat-dock-title" data-i18n="global.heading"></h3>
      <ol id="global-dock-list" class="chat-list chat-dock-list" aria-live="polite"></ol>
      <form id="global-dock-form" class="chat-form chat-dock-form" autocomplete="off">
        <input id="global-dock-input" maxlength="280" data-i18n-attr="placeholder:global.placeholder,aria-label:global.placeholder" />
        <button type="submit" class="small" data-i18n="chat.send"></button>
      </form>
    </aside>
    <p id="game-live" class="visually-hidden" aria-live="polite"></p>
  </section>

  <!-- ======================================================= settings -->
  <section id="screen-settings" class="screen screen-settings" hidden>
    <header class="page-header">
      <button id="settings-back" type="button" class="icon-button" data-i18n-attr="aria-label:nav.back,title:nav.back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1 data-i18n="settings.heading"></h1>
    </header>

    <main class="settings-main">
      <div class="card">
        <h2 data-i18n="account.heading"></h2>
        <p id="who-am-i" class="muted"></p>
        <form id="rename-form" autocomplete="off">
          <div class="field">
            <label for="display-name" data-i18n="account.display_name_label"></label>
            <input id="display-name" name="display_name" maxlength="80" required
                   data-i18n-attr="placeholder:account.display_name_placeholder" />
          </div>
          <button type="submit" data-i18n="account.save_button"></button>
        </form>
        <p id="rename-saved" class="notice notice-ok" data-i18n="account.saved_notice" hidden></p>
        <button id="logout-button" type="button" class="secondary" data-i18n="account.logout_button"></button>
        <div id="delete-me-row" class="delete-me-row" hidden>
          <button id="delete-me-button" type="button" class="ghost danger-text" data-i18n="account.delete_button"></button>
        </div>
      </div>

      <div class="card">
        <h2 data-i18n="profile.heading"></h2>
        <div class="avatar-preview-row">
          <span id="avatar-preview" class="avatar avatar-large" aria-hidden="true"></span>
          <p class="muted" data-i18n="profile.description"></p>
        </div>
        <h3 data-i18n="profile.icon"></h3>
        <div id="icon-grid" class="icon-grid" role="radiogroup" data-i18n-attr="aria-label:profile.icon"></div>
        <h3 data-i18n="profile.color"></h3>
        <div id="color-grid" class="color-picker"></div>
      </div>

      <!-- Signing in somewhere else: a one-time link to yourself. -->
      <div class="card">
        <h2 data-i18n="device_link.heading"></h2>
        <p class="muted" data-i18n="device_link.description"></p>
        <button id="device-link-button" type="button" data-i18n="device_link.button"></button>
        <div id="device-link-box" class="notice notice-link" hidden>
          <p id="device-link-notice"></p>
          <code id="device-link-value"></code>
          <button id="device-link-copy" type="button" class="secondary" data-i18n="device_link.copy"></button>
          <span id="device-link-copied" class="muted" data-i18n="device_link.copied" hidden></span>
        </div>
      </div>

      <div class="card" id="signup-links-panel" hidden>
        <h2 data-i18n="signup_links.heading"></h2>
        <p class="muted" data-i18n="signup_links.description"></p>
        <form id="signup-link-form" autocomplete="off">
          <div class="field">
            <label for="signup-link-label" data-i18n="signup_links.label"></label>
            <input id="signup-link-label" maxlength="80" required data-i18n-attr="placeholder:signup_links.label_placeholder" />
          </div>
          <div class="field">
            <label for="signup-link-uses" data-i18n="signup_links.max_uses"></label>
            <input id="signup-link-uses" type="number" min="1" max="1000" value="10" inputmode="numeric" required />
          </div>
          <div class="field">
            <label for="signup-link-days" data-i18n="signup_links.days"></label>
            <input id="signup-link-days" type="number" min="1" max="365" value="30" inputmode="numeric" required />
          </div>

      <div class="sheet-actions">
        <button type="button" class="secondary" data-sheet-close data-i18n="common.cancel"></button>
        <button id="delete-user-confirm" type="button" class="danger" data-i18n="admin.delete_button"></button>
      </div>
    </div>

    <div id="sheet-confirm-revoke-user" class="sheet" hidden>
      <div class="sheet-grip" aria-hidden="true"></div>
      <h2 data-i18n="admin.revoke_heading"></h2>
      <p id="revoke-user-body"></p>
      <div class="sheet-actions">
        <button type="button" class="secondary" data-sheet-close data-i18n="common.cancel"></button>
        <button id="revoke-user-confirm" type="button" class="danger" data-i18n="admin.revoke_button"></button>
      </div>
    </div>

    <div id="sheet-confirm-delete-me" class="sheet" hidden>
      <div class="sheet-grip" aria-hidden="true"></div>
      <h2 data-i18n="account.delete_heading"></h2>
      <p data-i18n="account.delete_body"></p>
      <div class="sheet-actions">
        <button type="button" class="secondary" data-sheet-close data-i18n="common.cancel"></button>
        <button id="delete-me-confirm" type="button" class="danger" data-i18n="account.delete_confirm"></button>
      </div>
    </div>

    <div id="sheet-chat" class="sheet sheet-tall" hidden>
      <div class="sheet-grip" aria-hidden="true"></div>
      <div class="segmented" role="tablist">
        <button type="button" role="tab" data-chat-tab="chat" data-i18n="chat.tab_chat"></button>
        <button type="button" role="tab" data-chat-tab="global" data-i18n="global.tab"></button>
        <button type="button" role="tab" data-chat-tab="log" data-i18n="chat.tab_log"></button>
      </div>
      <ol id="chat-list" class="chat-list"></ol>
      <ol id="global-list" class="chat-list" hidden></ol>
      <ol id="log-list" class="chat-list log-list" hidden></ol>
      <p class="guest-chat-as" data-guest-as hidden>
        <span data-guest-as-text></span>
        <button type="button" class="link-button" data-guest-change data-i18n="chat.change_name"></button>
      </p>
      <form id="chat-form" class="chat-form" autocomplete="off">
        <input data-guest-name class="guest-name" maxlength="24" hidden data-i18n-attr="placeholder:chat.guest_name_placeholder,aria-label:chat.guest_name_placeholder" />
        <input id="chat-input" maxlength="280" data-i18n-attr="placeholder:chat.placeholder,aria-label:chat.placeholder" />
        <button type="submit" data-i18n="chat.send"></button>
      </form>
      <form id="global-form" class="chat-form" autocomplete="off" hidden>
        <input id="global-input" maxlength="280" data-i18n-attr="placeholder:global.placeholder,aria-label:global.placeholder" />
        <button type="submit" data-i18n="chat.send"></button>
      </form>
    </div>

    <div id="sheet-last-trick" class="sheet" hidden>
      <div class="sheet-grip" aria-hidden="true"></div>
      <h2 data-i18n="menu.last_trick"></h2>
      <p id="last-trick-caption" class="muted"></p>
      <div id="last-trick-cards" class="mini-cards"></div>
      <p id="last-trick-empty" class="muted" data-i18n="last_trick.none" hidden></p>
      <button type="button" class="secondary" data-sheet-close data-i18n="common.close"></button>
    </div>

    <div id="sheet-scores" class="sheet" hidden>
      <div class="sheet-grip" aria-hidden="true"></div>
      <h2 data-i18n="menu.scores"></h2>
      <div class="table-scroll">
        <table class="score-table">
          <thead>
            <tr>
              <th data-i18n="scores.hand"></th>
              <th data-i18n="scores.bid"></th>
              <th id="scores-us-heading"></th>
              <th id="scores-them-heading"></th>
            </tr>
          </thead>
          <tbody id="scores-body"></tbody>
        </table>
      </div>
      <p id="scores-empty" class="muted" data-i18n="scores.none" hidden></p>
      <button type="button" class="secondary" data-sheet-close data-i18n="common.close"></button>
    </div>

    <div id="sheet-rules" class="sheet sheet-tall" hidden>
      <div class="sheet-grip" aria-hidden="true"></div>
      <h2 data-i18n="rules.heading"></h2>
      <ul id="rules-table-options" class="chip-row"></ul>
      <!-- A new tab, so reading the full guide never takes you off the table. -->
      <p class="rules-full-guide"><a class="guide-link" href="/#/rules" target="_blank" rel="noopener" data-i18n="rules.full_guide"></a></p>
      <div class="rules-body">
        <p data-i18n="rules.deck"></p>
        <p data-i18n="rules.counters"></p>
        <p data-i18n="rules.bidding"></p>
        <p data-i18n="rules.kitty"></p>
        <p data-i18n="rules.play"></p>
        <p data-i18n="rules.scoring"></p>
        <p data-i18n="rules.keyboard"></p>
        <p data-i18n="rules.keyboard_kitty"></p>
      </div>
      <button type="button" class="secondary" data-sheet-close data-i18n="common.close"></button>
    </div>

    <div id="sheet-summary" class="sheet" hidden>
      <div class="sheet-grip" aria-hidden="true"></div>
      <div id="summary-art" class="summary-art" hidden></div>
      <h2 id="summary-title"></h2>
      <p id="summary-subtitle" class="summary-subtitle"></p>
      <div class="summary-teams">
        <div class="summary-team team-us">
          <h3 id="summary-us-name"></h3>
          <dl>
            <dt id="summary-us-taken-label" data-i18n="summary.taken"></dt><dd id="summary-us-taken"></dd>
            <dt data-i18n="summary.previous"></dt><dd id="summary-us-previous"></dd>
            <dt data-i18n="summary.scored"></dt><dd id="summary-us-scored"></dd>
            <dt class="summary-new-total" data-i18n="summary.total"></dt><dd class="summary-new-total" id="summary-us-total"></dd>
          </dl>
        </div>
        <div class="summary-team team-them">
          <h3 id="summary-them-name"></h3>
          <dl>
            <dt id="summary-them-taken-label" data-i18n="summary.taken"></dt><dd id="summary-them-taken"></dd>
            <dt data-i18n="summary.previous"></dt><dd id="summary-them-previous"></dd>
            <dt data-i18n="summary.scored"></dt><dd id="summary-them-scored"></dd>
            <dt class="summary-new-total" data-i18n="summary.total"></dt><dd class="summary-new-total" id="summary-them-total"></dd>
          </dl>
        </div>
      </div>
      <p id="summary-kitty-caption" class="muted"></p>
      <div id="summary-kitty" class="mini-cards"></div>
      <p id="summary-waiting" class="muted summary-waiting"></p>
      <div class="sheet-actions">
        <button id="summary-lobby" type="button" class="secondary" data-i18n="summary.back_to_lobby" hidden></button>
        <button id="summary-continue" type="button" data-i18n="summary.next_hand"></button>
      </div>
    </div>

    <div id="sheet-share" class="sheet" hidden>
      <div class="sheet-grip" aria-hidden="true"></div>
      <h2 data-i18n="share.heading"></h2>
      <div class="share-block">
        <h3 data-i18n="share.join_heading"></h3>
        <p class="muted" data-i18n="share.join_help"></p>
        <code id="share-join-link" class="share-link"></code>
        <div class="sheet-actions">
          <button type="button" class="secondary" data-share-copy="share-join-link" data-i18n="share.copy"></button>
          <button type="button" data-share-send="share-join-link" data-i18n="share.send" hidden></button>
        </div>
      </div>
      <div class="share-block">
        <h3 data-i18n="share.watch_heading"></h3>
        <p class="muted" data-i18n="share.watch_help"></p>
        <code id="share-watch-link" class="share-link"></code>
        <div class="sheet-actions">
          <button type="button" class="secondary" data-share-copy="share-watch-link" data-i18n="share.copy"></button>
          <button type="button" data-share-send="share-watch-link" data-i18n="share.send" hidden></button>
        </div>
      </div>
      <span id="share-copied" class="muted" data-i18n="share.copied" hidden></span>
      <button type="button" class="secondary" data-sheet-close data-i18n="common.close"></button>
    </div>

    <div id="sheet-history" class="sheet sheet-tall" hidden>
      <div class="sheet-grip" aria-hidden="true"></div>
      <h2 data-i18n="admin_game.history"></h2>
      <p class="muted" data-i18n="admin_game.history_help"></p>
      <ol id="history-list" class="history-list"></ol>
      <button type="button" class="secondary" data-sheet-close data-i18n="common.close"></button>
    </div>

    <div id="sheet-confirm-manage" class="sheet" hidden>
      <div class="sheet-grip" aria-hidden="true"></div>
      <h2 id="manage-heading"></h2>
      <p id="manage-body"></p>
      <div class="sheet-actions">
        <button type="button" class="secondary" data-sheet-close data-i18n="common.cancel"></button>
        <button id="manage-confirm" type="button" class="danger"></button>
      </div>
    </div>

    <div id="sheet-confirm-leave" class="sheet" hidden>
      <div class="sheet-grip" aria-hidden="true"></div>
      <h2 data-i18n="leave.heading"></h2>
      <p id="leave-body"></p>
      <div class="sheet-actions">
        <button type="button" class="secondary" data-sheet-close data-i18n="common.cancel"></button>
        <button id="leave-confirm" type="button" class="danger" data-i18n="leave.confirm"></button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!--
    Plain scripts in dependency order. No bundler, no modules that need a
    build step: each file adds one global and the browser runs them as-is.
  -->
  <script src="/js/dom.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/fullscreen.js"></script>
  <script src="/js/stream.js"></script>
  <script src="/js/art-paths.js"></script>
  <script src="/js/art.js"></script>
  <script src="/js/cards.js"></script>
  <script src="/js/keys.js"></script>
  <script src="/js/settings.js"></script>
  <script src="/js/profile.js"></script>
  <script src="/js/links.js"></script>
  <script src="/js/join.js"></script>
  <script src="/js/signup.js"></script>
  <script src="/js/lobby.js"></script>
  <script src="/js/seats.js"></script>
  <script src="/js/fling.js"></script>
  <script src="/js/hand.js"></script>
  <script src="/js/trick.js"></script>
  <script src="/js/bidding.js"></script>
  <script src="/js/kitty.js"></script>
  <script src="/js/summary.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/global.js"></script>
  <script src="/js/hint.js"></script>
  <script src="/js/history.js"></script>
  <script src="/js/record.js"></script>
  <script src="/js/observe.js"></script>
  <script src="/js/cardkeys.js"></script>
  <script src="/js/table.js"></script>
  <script src="/js/games.js"></script>
  <script src="/js/guide.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
