# Optional configuration file.
#
# Copy this to your app directory to use it -- it is NOT read from the project
# root. The app directory is printed at startup ("[state] ..."), and defaults
# to:
#
#   ~/.config/rook/config.yaml       (or $XDG_CONFIG_HOME/rook/)
#   /app/data/config.yaml                        (in the container)
#
#   cp config.example.yaml ~/.config/rook/config.yaml
#
# Every key here has an environment-variable equivalent, and the environment
# always wins -- so a container can override a file baked into an image, and
# a one-off run can override both. Nothing here is required; the defaults are
# a complete configuration on their own.
#
# Key                       Environment variable
# ------------------------  --------------------------
# port                      PORT
# host                      HOST
# secure_cookies            SECURE_COOKIES
# cookie_name               COOKIE_NAME
# session_ttl_seconds       SESSION_TTL_SECONDS
# login_token_ttl_seconds   LOGIN_TOKEN_TTL_SECONDS
# api_keys                  API_KEYS
# api_key_ttl_seconds       API_KEY_TTL_SECONDS
# encrypt_at_rest           ENCRYPT_AT_REST
# control_socket            CONTROL_SOCKET
# rate_limit_max            RATE_LIMIT_MAX
# rate_limit_window_seconds RATE_LIMIT_WINDOW_SECONDS
# body_limit_bytes          BODY_LIMIT_BYTES
# trust_proxy               TRUST_PROXY
# trusted_proxies           TRUSTED_PROXIES  (comma-separated in the env var)
# proxy_header              PROXY_HEADER
# project_name              PROJECT_NAME
# static_dir                STATIC_DIR
# language_file             LANGUAGE_FILE
# secret_key                SECRET_KEY
# event_stream_seconds      EVENT_STREAM_SECONDS
# bot_delay_ms              BOT_DELAY_MS
# table_retention_hours     TABLE_RETENTION_HOURS
# max_tables                MAX_TABLES
# bot_names_file            BOT_NAMES_FILE

# 127.0.0.1 answers only this machine, which is what a development run and a
# server behind a reverse proxy on the same host both want. Use 0.0.0.0 to
# listen on every interface -- phones on the home network, say -- and then put
# TLS in front, because login links, cookies, and API keys all cross the wire.
# The Docker image sets HOST=0.0.0.0 itself.
#host: 127.0.0.1
port: 8080

# false ONLY for plain http://localhost. A Secure cookie is silently dropped
# over http, so login appears to succeed and then does nothing.
secure_cookies: true

# Turn on when a reverse proxy you control is in front, so the rate limiter
# sees each visitor's address instead of the proxy's. proxy_header is then
# believed only on connections from an address in trusted_proxies -- the
# address your proxy connects *from*, as this server sees it -- and read right
# to left, skipping trusted hops, so whatever a client wrote further left is
# ignored. trust_proxy without trusted_proxies is refused at startup.
#
#   proxy on the same host, bare binary:  [127.0.0.1, "::1"]
#   proxy on the host, app in Docker:     [172.16.0.0/12] (the bridge gateway;
#                                         check `docker network inspect bridge`)
#
# This only holds if clients cannot reach this server except through the
# proxy. With a single-value header (X-Real-IP, CF-Connecting-IP) the proxy
# must also overwrite whatever the client sent rather than pass it on.
trust_proxy: false
trusted_proxies: []

session_ttl_seconds: 7776000     # 90 days -- signing back in needs an admin's link
login_token_ttl_seconds: 259200  # 3 days -- invites are often opened hours later

rate_limit_max: 120
rate_limit_window_seconds: 60

# API keys let a script, a cron job, or another service call the API the way a
# signed-in person does. A key carries a role from the same set users have, so
# an admin-scoped key can do what an admin can, and it can never outrank the
# account that owns it.
#
# Setting this to false closes that surface completely: the Authorization
# header stops being believed, existing keys stop working (the rows survive, so
# switching it back on restores them), and the endpoints that mint keys 404.
#api_keys: true

# Default lifetime for a new key, when the request does not say. A key can be
# minted with no expiry at all, but that has to be asked for on purpose
# (expires_in_days: 0, or `manage create-key -days 0`).
api_key_ttl_seconds: 7776000     # 90 days

# Encrypts every value written to the database. Losing the key makes the data
# permanently unreadable, so back up secret.key alongside app.db.
encrypt_at_rest: true

# Leave this out. When unset, a key is generated once into secret.key (mode
# 0600) in the app directory, which is what lets a portable binary just run.
# Setting it here puts a secret in a file you might commit; prefer the
# SECRET_KEY environment variable if you need to supply it explicitly.
# secret_key: ""

# Let other processes reach the database through the running server, over a
# unix socket in the app directory (control.sock, mode 0600). This is what
# makes `manage` work while the server is up -- bolt allows only one process
# to open the database, so without it every admin command needs the server
# stopped first.
#
# Turning it off is a deliberate choice, not a hardening win: the socket is
# reachable only by something that can already read secret.key and app.db
# sitting beside it.
#control_socket: true

# --- The card game ---------------------------------------------------------

# Live updates reach the browser over a stream that the server ends after this
# many seconds; the browser reconnects at once. Capped at 25, because the
# server's 30-second write timeout applies to a whole streamed response.
event_stream_seconds: 20

# How long a computer player "thinks" before moving, in milliseconds. Too low
# and a trick resolves before anyone can see who played what.
bot_delay_ms: 900

# Finished tables, and tables nobody has touched, are removed after this long.
table_retention_hours: 72

# The most tables that can exist at once.
max_tables: 50

# A CSV of names that random bots can be named from instead of the built-in
# list, once the owner picks "Names file" in Game settings (along with how
# many of the most popular to use). It needs a header row with name and
# total_count columns; other columns are ignored, and a name listed twice
# (once per sex, say) counts once with its totals added. Read at startup, so
# restart after changing it. A relative path is from where the server runs.
# A copy of the default file is compiled into the binary and used when the
# default path has nothing on disk (in Docker, say); a path you set yourself
# must exist.
bot_names_file: ./misc/biblical-persons.csv
